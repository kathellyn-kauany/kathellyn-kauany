<svg width="1400" height="320" viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00995D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00995D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00995D"/>
      <stop offset="100%" stop-color="#EAFBF2"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#00995D" opacity="0.18"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="1400" height="320" fill="#0D1117"/>
  <rect width="1400" height="320" fill="url(#dots)"/>

  <!-- linhas divisorias -->
  <line x1="480" y1="30" x2="480" y2="290" stroke="#00995D" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="820" y1="30" x2="820" y2="290" stroke="#00995D" stroke-opacity="0.3" stroke-width="1"/>

  <!-- ==== COLUNA 1: citacao + lampada ==== -->
  <text x="40" y="45" fill="#EAFBF2" font-family="Georgia, serif" font-size="17" font-style="italic">A melhor forma de prever</text>
  <text x="40" y="68" fill="#EAFBF2" font-family="Georgia, serif" font-size="17" font-style="italic">o futuro é <tspan font-weight="bold" font-style="normal" fill="#00995D">construí-lo.</tspan></text>
  <text x="40" y="98" fill="#00995D" font-family="Brush Script MT, cursive" font-size="22" font-style="italic">Kathe K.</text>

  <!-- glow atras da lampada -->
  <circle cx="230" cy="175" r="95" fill="url(#bulbGlow)" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.9;0.5;1;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- plataforma / base holografica -->
  <ellipse cx="230" cy="268" rx="120" ry="14" fill="none" stroke="#00995D" stroke-width="2" opacity="0.9"/>
  <ellipse cx="230" cy="268" rx="85" ry="9" fill="none" stroke="#00995D" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="230" cy="268" rx="50" ry="5" fill="#00995D" opacity="0.25"/>
  <rect x="180" y="252" width="100" height="10" rx="3" fill="#0D1117" stroke="#00995D" stroke-width="1.5"/>

  <!-- haste ate o nucleo de luz -->
  <line x1="230" y1="252" x2="230" y2="205" stroke="#00995D" stroke-width="2" opacity="0.8"/>

  <!-- nucleo de luz -->
  <circle cx="230" cy="160" r="30" fill="#00995D" opacity="0.55">
    <animate attributeName="opacity" values="0.5;0.85;0.4;0.7;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="160" r="13" fill="#EAFBF2" opacity="0.9">
    <animate attributeName="opacity" values="0.8;1;0.5;0.9;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- pontos de luz flutuando ao redor -->
  <g fill="#00995D">
    <circle cx="188" cy="118" r="3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="112" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="292" cy="150" r="3.5"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="200" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="212" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="182" cy="205" r="2.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="160" r="3"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="203" cy="98" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="95" r="2.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="175" r="2"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="152" cy="135" r="2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="220" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ==== COLUNA 2: pilares ==== -->
  <!-- Inovacao -->
  <circle cx="525" cy="55" r="16" fill="none" stroke="#00995D" stroke-width="1.5"/>
  <path d="M525 47a8 8 0 00-4 15h8a8 8 0 00-4-15z" fill="none" stroke="#00995D" stroke-width="1.3"/>
  <text x="552" y="52" fill="#00995D" font-family="Arial, sans-serif" font-size="13" font-weight="bold">INOVAÇÃO</text>
  <text x="552" y="68" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">Explorando ideias e tecnologias</text>
  <text x="552" y="82" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">para construir o que vem a seguir.</text>

  <!-- Desenvolvimento -->
  <circle cx="525" cy="115" r="16" fill="none" stroke="#00995D" stroke-width="1.5"/>
  <text x="518" y="120" fill="#00995D" font-family="Consolas, monospace" font-size="13" font-weight="bold">&lt;/&gt;</text>
  <text x="552" y="112" fill="#00995D" font-family="Arial, sans-serif" font-size="13" font-weight="bold">DESENVOLVIMENTO</text>
  <text x="552" y="128" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">Construindo aplicações e</text>
  <text x="552" y="142" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">experiências digitais.</text>

  <!-- Automacao -->
  <circle cx="525" cy="175" r="16" fill="none" stroke="#00995D" stroke-width="1.5"/>
  <circle cx="525" cy="175" r="7" fill="none" stroke="#00995D" stroke-width="1.3"/>
  <g stroke="#00995D" stroke-width="1.3">
    <line x1="525" y1="164" x2="525" y2="168"/>
    <line x1="525" y1="182" x2="525" y2="186"/>
    <line x1="514" y1="175" x2="518" y2="175"/>
    <line x1="532" y1="175" x2="536" y2="175"/>
  </g>
  <text x="552" y="172" fill="#00995D" font-family="Arial, sans-serif" font-size="13" font-weight="bold">AUTOMAÇÃO</text>
  <text x="552" y="188" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">Criando fluxos inteligentes que</text>
  <text x="552" y="202" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">economizam tempo e escalam.</text>

  <!-- Projetos -->
  <path d="M525 217 L534 235 L525 231 L516 235 Z" fill="none" stroke="#00995D" stroke-width="1.4"/>
  <text x="552" y="232" fill="#00995D" font-family="Arial, sans-serif" font-size="13" font-weight="bold">PROJETOS</text>
  <text x="552" y="248" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">Do conceito à execução.</text>
  <text x="552" y="262" fill="#B9C4C0" font-family="Arial, sans-serif" font-size="11">De problemas a produtos.</text>

  <!-- ==== COLUNA 3: nome + tagline ==== -->
  <text x="855" y="110" fill="url(#nameGrad)" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="2">KATHE<tspan fill="#00995D" font-size="46">&lt;_</tspan></text>

  <line x1="857" y1="128" x2="1360" y2="128" stroke="#00995D" stroke-opacity="0.4"/>

  <text x="857" y="150" fill="#EAFBF2" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.5">FULL-STACK DEVELOPER &#8226; AUTOMATION ENTHUSIAST &#8226; BUILDER</text>

  <text x="857" y="192" fill="#EAFBF2" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Transformando ideias em</text>
  <text x="857" y="222" fill="#00995D" font-family="Arial, sans-serif" font-size="26" font-weight="bold">produtos, automações</text>
  <text x="857" y="252" fill="#EAFBF2" font-family="Arial, sans-serif" font-size="26" font-weight="bold">e impacto real.</text>

  <text x="857" y="278" fill="#9AA5A1" font-family="Arial, sans-serif" font-size="13">Desenvolvo soluções, construo automações e transformo</text>
  <text x="857" y="294" fill="#9AA5A1" font-family="Arial, sans-serif" font-size="13">problemas complexos em experiências digitais escaláveis.</text>
</svg>
